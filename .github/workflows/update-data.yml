name: Weekly data refresh

on:
  schedule:
    # 02:30 UTC Saturday = 08:00 IST — after the US Friday close (20:00 UTC),
    # so every sleeve has a complete trading week. Weekly matches the weekly
    # return frequency the optimizer is estimated on.
    - cron: "30 2 * * 6"
  workflow_dispatch: {}   # manual run from the Actions tab

permissions:
  contents: write   # push the refreshed data files back to the repo

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # build_data.py exits non-zero if any validation gate fails
      # (weights != 1, non-concave frontier, VaR/CVaR ordering, etc.),
      # in which case nothing is committed and the last good data stays live.
      - name: Run pipeline
        run: python pipeline/build_data.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/portfolio-data.json docs/data/portfolio-data.js
          git commit -m "Weekly data refresh $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push

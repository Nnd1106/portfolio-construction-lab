name: Daily data refresh (weekdays)

on:
  schedule:
    # 12:00 UTC Mon-Fri = 5:30 PM IST, two hours after the NSE close (15:30 IST)
    # so the day's closes have settled. India has no daylight saving, so this
    # stays 5:30 PM IST all year. US sleeves use their previous completed
    # session; the fetcher drops any bar from a session still in progress
    # (GitHub often starts scheduled jobs late). Estimation stays weekly:
    # the optimizer uses completed Friday-to-Friday weeks only.
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}   # manual run from the Actions tab

permissions:
  contents: write   # push the refreshed data files back to the repo

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # build_data.py exits non-zero if any validation gate fails
      # (weights != 1, non-concave frontier, VaR/CVaR ordering, etc.),
      # in which case nothing is committed and the last good data stays live.
      - name: Run pipeline
        run: python pipeline/build_data.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/portfolio-data.json docs/data/portfolio-data.js
          git commit -m "Daily data refresh $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
